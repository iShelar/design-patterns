<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" role="img" aria-label="UML class diagram of the Strategy pattern in 00_strategy.py">
  <rect x="0" y="0" width="940" height="680" fill="#ffffff"/>

  <!-- ============ relationships ============ -->

  <!-- OrderController -> OrderService : creates -->
  <line x1="205" y1="96" x2="205" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="199,158 205,170 211,158" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="213" y="136" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">creates</text>

  <!-- OrderController note connector -->
  <line x1="400" y1="75" x2="360" y2="68" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- OrderService -> DiscountStrategy : aggregation (discount_strategy) -->
