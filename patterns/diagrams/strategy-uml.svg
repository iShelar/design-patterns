  <polygon points="345,211 357,203.5 369,211 357,218.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="406" y="207" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">discount_strategy</text>

