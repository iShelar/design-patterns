  <polygon points="470,470 462,482 478,482" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>

  <!-- ============ classes ============ -->

  <!-- OrderController -->
  <rect x="50" y="40" width="310" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="50" y="40" width="310" height="30" fill="#eef2f7"/>
  <rect x="50" y="40" width="310" height="56" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="50" y1="70" x2="360" y2="70" stroke="#1f2937" stroke-width="1"/>
  <text x="205" y="59" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#1f2937">OrderController</text>
  <text x="60" y="86" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ checkout(customer_type, subtotal): float</text>

  <!-- note -->
  <path d="M400,30 L664,30 L680,46 L680,120 L400,120 Z" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <path d="M664,30 L664,46 L680,46" stroke="#9ca3af" stroke-width="1.2" fill="none"/>
  <text x="414" y="52" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#6b7280">Builds one instance per</text>
  <text x="414" y="68" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#6b7280">customer_type key, then</text>
  <text x="414" y="84" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#6b7280">passes the match into</text>
  <text x="414" y="100" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="10.5" fill="#6b7280">OrderService &#8212; see checkout()</text>

  <!-- OrderService -->
  <rect x="65" y="170" width="280" height="82" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="65" y="170" width="280" height="30" fill="#eef2f7"/>
  <rect x="65" y="170" width="280" height="82" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="65" y1="200" x2="345" y2="200" stroke="#1f2937" stroke-width="1"/>
  <line x1="65" y1="226" x2="345" y2="226" stroke="#1f2937" stroke-width="1"/>
