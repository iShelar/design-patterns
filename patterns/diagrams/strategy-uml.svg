  <text x="490" y="606" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2937">+ discount(subtotal): float</text>
  <text x="490" y="619" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// 15% flat</text>

  <!-- Concrete strategy: FirstOrderPromoDiscount -->
  <rect x="700" y="560" width="200" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="700" y="560" width="200" height="30" fill="#eef2f7"/>
  <rect x="700" y="560" width="200" height="74" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="700" y1="590" x2="900" y2="590" stroke="#1f2937" stroke-width="1"/>
  <text x="800" y="579" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="11.5" fill="#1f2937">FirstOrderPromoDiscount</text>
  <text x="710" y="606" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2937">+ discount(subtotal): float</text>
  <text x="710" y="619" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// 20%, capped at 200</text>

  <!-- ============ legend ============ -->
