  <text x="470" y="434" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-weight="600" font-size="13" fill="#1f2937">DiscountStrategy</text>
  <text x="370" y="460" font-family="Menlo, Consolas, monospace" font-style="italic" font-size="10.5" fill="#1f2937">+ discount(subtotal): float</text>

  <!-- Concrete strategy: RegularDiscount -->
  <rect x="40" y="560" width="200" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="40" y="560" width="200" height="30" fill="#eef2f7"/>
