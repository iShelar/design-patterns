  <text x="270" y="619" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// 10% flat</text>

  <!-- Concrete strategy: PremiumDiscount -->
  <rect x="480" y="560" width="200" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="480" y="560" width="200" height="30" fill="#eef2f7"/>
  <rect x="480" y="560" width="200" height="74" fill="none" stroke="#1f2937" stroke-width="1.5"/>
