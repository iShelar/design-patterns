  <line x1="140" y1="560" x2="140" y2="520" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="360" y1="560" x2="360" y2="520" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="580" y1="560" x2="580" y2="520" stroke="#1f2937" stroke-width="1.5"/>
