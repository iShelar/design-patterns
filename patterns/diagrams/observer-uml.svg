<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-label="UML class diagram of the Observer pattern as implemented in 01_observer.py: Observable and Observer are pure abstract interfaces, Order implements Observable and owns the observer list, and OrderController wires everything together">
  <rect x="0" y="0" width="1060" height="560" fill="#ffffff"/>

  <!-- ============ relationships ============ -->

  <!-- OrderController -> Order : creates -->
  <line x1="170" y1="76" x2="20" y2="76" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="20" y1="76" x2="20" y2="380" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="20" y1="380" x2="50" y2="380" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="38,374 50,380 38,386" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="25" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">creates</text>

  <!-- OrderController -> EmailNotifier/SmsNotifier/WarehouseService : creates -->
  <line x1="650" y1="48" x2="1040" y2="48" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1040" y1="48" x2="1040" y2="300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1040" y1="300" x2="460" y2="300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="460" y1="300" x2="460" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="670" y1="300" x2="670" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="880" y1="300" x2="880" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="454,308 460,320 466,308" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <polyline points="664,308 670,320 676,308" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <polyline points="874,308 880,320 886,308" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="670" y="294" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">creates</text>

  <!-- Order -> Observable : generalization -->
  <line x1="170" y1="308" x2="170" y2="250" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="170,238 162,250 178,250" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Order aggregates Observer (_observers) -->
  <line x1="314" y1="382" x2="480" y2="382" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="480" y1="382" x2="480" y2="175" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="480" y1="175" x2="600" y2="175" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="290,382 302,375 314,382 302,389" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="490" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">_observers  0..*</text>

  <!-- generalization tree: 3 concretes -> Observer -->
  <line x1="500" y1="320" x2="500" y2="270" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="710" y1="320" x2="710" y2="270" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="920" y1="320" x2="920" y2="270" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="500" y1="270" x2="920" y2="270" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="710" y1="270" x2="710" y2="222" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="710,210 702,222 718,222" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>

  <!-- ============ classes ============ -->

  <!-- OrderController -->
  <rect x="90" y="20" width="560" height="56" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="90" y="20" width="560" height="30" fill="#eef2f7"/>
  <rect x="90" y="20" width="560" height="56" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="650" y2="50" stroke="#1f2937" stroke-width="1"/>
  <text x="370" y="39" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#1f2937">OrderController</text>
  <text x="100" y="66" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ create_order()</text>

  <!-- Observable (abstract) -->
  <rect x="50" y="140" width="240" height="98" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="50" y="140" width="240" height="44" fill="#eaf0fe"/>
  <rect x="50" y="140" width="240" height="98" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="50" y1="184" x2="290" y2="184" stroke="#2563eb" stroke-width="1"/>
  <text x="170" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1" fill="#2563eb">&#171;abstract&#187;</text>
  <text x="170" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-weight="600" font-size="13" fill="#1f2937">Observable</text>
  <text x="60" y="200" font-family="Menlo, Consolas, monospace" font-style="italic" font-size="10.5" fill="#1f2937">+ attach(observer)</text>
  <text x="60" y="216" font-family="Menlo, Consolas, monospace" font-style="italic" font-size="10.5" fill="#1f2937">+ detach(observer)</text>
  <text x="60" y="232" font-family="Menlo, Consolas, monospace" font-style="italic" font-size="10.5" fill="#1f2937">+ notify()</text>

  <!-- Order (concrete Observable) -->
  <rect x="50" y="308" width="240" height="152" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="50" y="308" width="240" height="30" fill="#eef2f7"/>
  <rect x="50" y="308" width="240" height="152" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="50" y1="338" x2="290" y2="338" stroke="#1f2937" stroke-width="1"/>
  <line x1="50" y1="392" x2="290" y2="392" stroke="#1f2937" stroke-width="1"/>
  <text x="170" y="327" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="13" fill="#1f2937">Order</text>
  <text x="60" y="354" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ order_id: str</text>
  <text x="60" y="368" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ status: str</text>
  <text x="60" y="382" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">- _observers: List[Observer]</text>
  <text x="60" y="408" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ attach(observer)</text>
  <text x="60" y="424" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ detach(observer)</text>
  <text x="60" y="440" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ notify()</text>
  <text x="60" y="456" font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1f2937">+ set_status(status)</text>

  <!-- Observer (abstract) -->
  <rect x="600" y="140" width="220" height="70" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="600" y="140" width="220" height="44" fill="#eaf0fe"/>
  <rect x="600" y="140" width="220" height="70" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="600" y1="184" x2="820" y2="184" stroke="#2563eb" stroke-width="1"/>
  <text x="710" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" letter-spacing="1" fill="#2563eb">&#171;abstract&#187;</text>
  <text x="710" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-weight="600" font-size="13" fill="#1f2937">Observer</text>
  <text x="610" y="200" font-family="Menlo, Consolas, monospace" font-style="italic" font-size="10.5" fill="#1f2937">+ update(order_id, status)</text>

  <!-- Concrete observer: EmailNotifier -->
  <rect x="405" y="320" width="190" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="405" y="320" width="190" height="30" fill="#eef2f7"/>
  <rect x="405" y="320" width="190" height="74" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="405" y1="350" x2="595" y2="350" stroke="#1f2937" stroke-width="1"/>
  <text x="500" y="339" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#1f2937">EmailNotifier</text>
  <text x="415" y="366" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2937">+ update(order_id, status)</text>
  <text x="415" y="379" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// prints "Email sent..."</text>

  <!-- Concrete observer: SmsNotifier -->
  <rect x="615" y="320" width="190" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="615" y="320" width="190" height="30" fill="#eef2f7"/>
  <rect x="615" y="320" width="190" height="74" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="615" y1="350" x2="805" y2="350" stroke="#1f2937" stroke-width="1"/>
  <text x="710" y="339" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#1f2937">SmsNotifier</text>
  <text x="625" y="366" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2937">+ update(order_id, status)</text>
  <text x="625" y="379" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// prints "SMS sent..."</text>

  <!-- Concrete observer: WarehouseService -->
  <rect x="825" y="320" width="190" height="74" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <rect x="825" y="320" width="190" height="30" fill="#eef2f7"/>
  <rect x="825" y="320" width="190" height="74" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="825" y1="350" x2="1015" y2="350" stroke="#1f2937" stroke-width="1"/>
  <text x="920" y="339" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#1f2937">WarehouseService</text>
  <text x="835" y="366" font-family="Menlo, Consolas, monospace" font-size="10" fill="#1f2937">+ update(order_id, status)</text>
  <text x="835" y="379" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="8.5" fill="#6b7280">// prints "Warehouse..."</text>

  <!-- ============ legend ============ -->
  <line x1="0" y1="490" x2="1060" y2="490" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="60" y1="514" x2="84" y2="514" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="84,514 94,508.5 94,519.5" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="102" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">generalization (is-a)</text>

  <line x1="340" y1="514" x2="364" y2="514" stroke="#1f2937" stroke-width="1.5"/>
  <polygon points="364,514 371,509 378,514 371,519" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="386" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">aggregation (has-a)</text>

  <line x1="620" y1="514" x2="644" y2="514" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polyline points="636,508.5 648,514 636,519.5" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="666" y="518" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#374151">dependency (creates / uses)</text>
</svg>
